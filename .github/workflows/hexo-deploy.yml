name: Hexo Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug - list files
        run: |
          ls -la
          echo "=== source dir ==="
          ls -la source/
          echo "=== _posts ==="
          ls -la source/_posts/

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Debug - hexo version
        run: npx hexo --version

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate --debug

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
