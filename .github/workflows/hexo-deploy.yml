name: Hexo Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate

      - name: Deploy to Like-dejavu.github.io
        run: |
          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/Like-dejavu/Like-dejavu.github.io.git" HEAD:main
