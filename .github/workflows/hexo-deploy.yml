name: Hexo Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate

      - name: Deploy to Like-dejavu.github.io
        run: |
          set -x

          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "ERROR: DEPLOY_TOKEN secret is empty!"
            exit 1
          fi

          # 测试 token 是否有效
          echo "=== Testing token ==="
          curl -s -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" https://api.github.com/user | head -5

          cd public
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::7}"

          echo "=== Pushing ==="
          git push --force -v "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/Like-dejavu/Like-dejavu.github.io.git" HEAD:main 2>&1
