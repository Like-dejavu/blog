name: Issue to Blog

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  issue-to-blog:
    if: |
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'blog') &&
      (github.event.action == 'opened' ||
       github.event.action == 'edited' ||
       (github.event.action == 'labeled' && github.event.label.name == 'blog'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate post file from issue
        id: gen
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          mkdir -p _posts

          node <<'NODE'
          const fs = require('fs');

          const title = process.env.ISSUE_TITLE || '未命名文章';
          let body = process.env.ISSUE_BODY || '';
          const issueNumber = process.env.ISSUE_NUMBER;
          const author = process.env.ISSUE_USER || 'unknown';

          // 清洗文件名
          const safeTitle = title
            .replace(/^[\s\-]+|[\s\-]+$/g, '')
            .replace(/[\\/:*?"<>|#%{}~`&$!'"()[\]]/g, '')
            .replace(/\s+/g, '-')
            .slice(0, 80) || 'post-' + issueNumber;

          const now = new Date();
          const pad = (n) => String(n).padStart(2, '0');
          const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
          const fullDateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

          const filename = `_posts/${dateStr}-${safeTitle}.md`;

          // 拼装 front-matter
          let content;
          if (/^---\s*\n/.test(body)) {
            const fmEnd = body.indexOf('\n---', 4);
            if (fmEnd === -1) {
              content = `---\ntitle: ${title}\ndate: ${fullDateStr}\nauthor: ${author}\n---\n\n${body}\n\n<!-- issue: ${issueNumber} -->\n`;
            } else {
              let fm = body.slice(4, fmEnd);
              const rest = body.slice(fmEnd + 4);
              if (!/^title:/m.test(fm)) fm = `title: ${title}\n` + fm;
              if (!/^date:/m.test(fm)) fm = `date: ${fullDateStr}\n` + fm;
              if (!/^author:/m.test(fm)) fm = `author: ${author}\n` + fm;
              content = `---${fm}---${rest}\n\n<!-- issue: ${issueNumber} -->\n`;
            }
          } else {
            content = `---\ntitle: ${title}\ndate: ${fullDateStr}\nauthor: ${author}\n---\n\n${body}\n\n<!-- issue: ${issueNumber} -->\n`;
          }

          fs.writeFileSync(filename, content, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `file_path=${filename}\n`);
          console.log('Generated:', filename);
          NODE

      - name: Commit and push
        shell: bash
        env:
          FILE_PATH: ${{ steps.gen.outputs.file_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add _posts/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "docs: add post from issue #${ISSUE_NUMBER} [skip ci]"
          git push origin source

      - name: Comment on issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const filePath = '${{ steps.gen.outputs.file_path }}';
            const repo = context.repo;

            const fileUrl = `https://github.com/${repo.owner}/${repo.repo}/blob/source/${filePath}`;

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber,
              body: `✅ 已自动生成博客文章：\n\n[${filePath}](${fileUrl})\n\n如需修改，直接编辑本 issue 后会自动同步。`
            });

            await github.rest.issues.update({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
